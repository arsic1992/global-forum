<div class="fm-index-top">
<!-- BEGIN switch_user_logged_in --><p class="right rightside fm-lastvisit">{LAST_VISIT_DATE}</p><!-- END switch_user_logged_in -->
<p class="fm-curtime">{CURRENT_TIME}</p>
</div>

<form action="{S_MODCP_ACTION}" method="post" class="fm-modform fm-move">
<div class="topic-actions fm-modpath-bar">
	<p class="fm-path fm-modpath"><a class="nav fm-path-home" href="{U_INDEX}"><span>{L_INDEX}</span></a>{NAV_CAT_DESC}</p>
</div>

<div class="panel fm-modcard">
	<div class="inner"><span class="corners-top"><span></span></span>
	<h1 class="page-title fm-modcard-title">{MESSAGE_TITLE}</h1>
	<fieldset class="fields1">
	<dl>
		<dt><label>{L_MOVE_TO_FORUM}</label></dt>
		<dd>{S_FORUM_SELECT}</dd>
	</dl>
	<!-- BEGIN switch_leave_shadow -->
	<dl>
		<dt>&nbsp;</dt>
		<dd><label class="fm-check-chip"><input name="move_leave_shadow" type="checkbox" />{L_LEAVESHADOW}</label></dd>
	</dl>
	<!-- END switch_leave_shadow -->
	<p class="center fm-move-confirm">
		{MESSAGE_TEXT}<br />
		{S_HIDDEN_FIELDS}
		<input class="button2 fm-yes" type="submit" name="confirm" value="{L_YES}" />&nbsp;
		<input class="button2 fm-no" type="submit" name="cancel" value="{L_NO}" />
	</p>
	</fieldset>
	<span class="corners-bottom"><span></span></span></div>
</div>
</form>
