<div class="fm-index-top">
	<!-- BEGIN switch_user_logged_in --><p class="right rightside fm-lastvisit">{LAST_VISIT_DATE}</p><!-- END switch_user_logged_in -->
	<p class="fm-curtime">{CURRENT_TIME}</p>
</div>

<h1 class="page-title fm-page-title">{L_FAQ_TITLE}</h1>

<!-- BEGIN faq_block_link -->
<div class="panel row1 fm-faq fm-faq-index">
	<div class="inner"><span class="corners-top"><span></span></span>
	<dl class="faq">
		<dt>{faq_block_link.BLOCK_TITLE}</dt>
		<!-- BEGIN faq_row_link -->
		<dd class="fm-faq-link"><a href="{faq_block_link.faq_row_link.U_FAQ_LINK}">{faq_block_link.faq_row_link.FAQ_LINK}</a></dd>
		<!-- END faq_row_link -->
	</dl>
	<span class="corners-bottom"><span></span></span></div>
</div>
<!-- END faq_block_link -->

<!-- BEGIN faq_block -->
<div class="panel {faq_block.ROW_CLASS_NEW} fm-faq fm-faq-answers">
	<div class="inner"><span class="corners-top"><span></span></span>
		<div class="content">
		<h1 class="page-title fm-faq-block-title">{faq_block.BLOCK_TITLE}</h1>
		<!-- BEGIN faq_row -->
		<dl class="faq fm-faq-item">
			<dt><a name="{faq_block.faq_row.U_FAQ_ID}"></a><b>{faq_block.faq_row.FAQ_QUESTION}</b></dt>
			<dd class="fm-faq-answer">{faq_block.faq_row.FAQ_ANSWER}</dd>
			<dd class="fm-faq-top"><a href="#top">{L_BACK_TO_TOP}&nbsp;{L_BACK_TO_TOP_TEXT}</a></dd>
		</dl>
		<hr class="dashed" />
		<!-- END faq_row -->
		</div>
	<span class="corners-bottom"><span></span></span></div>
</div>
<!-- END faq_block -->

<form class="fm-faq-jumpbox" action="{S_JUMPBOX_ACTION}" method="get" name="jumpbox" onsubmit="if(document.jumpbox.f.value == -1){return false;}">
	<p class="right">{L_JUMP_TO}:&nbsp;{S_JUMPBOX_SELECT}&nbsp;<input class="button2" type="submit" value="{L_GO}" /></p>
</form>
