<div class="forumbg forumbg-table fm-grp-members fm-grp-pending-box">
	<div class="inner"><span class="corners-top"><span></span></span>
		<table class="table1 fm-gm-table" cellspacing="1">
		<thead>
			<tr>
				<th class="pm">{L_PM}</th>
				<th class="name">{L_USERNAME}</th>
				<th class="posts">{L_POSTS}</th>
				<th class="website">{L_FROM}</th>
				<th class="website">{L_EMAIL}</th>
				<th class="website">{L_WEBSITE}</th>
				<th>{L_SELECT}</th>
			</tr>
		</thead>
		<tbody>
			<tr class="row3 fm-gm-section fm-gm-section-pending">
				<td colspan="8">{L_PENDING_MEMBERS}</td>
			</tr>
			<!-- BEGIN pending_members_row -->
			<tr class="{pending_members_row.ROW_CLASS} fm-gm-row fm-gm-pending">
				<td class="fm-gm-c-pm">{pending_members_row.PM_IMG}</td>
				<td class="fm-gm-c-name"><a href="{pending_members_row.U_VIEWPROFILE}">{pending_members_row.USERNAME}</a></td>
				<td class="fm-gm-c-posts">{pending_members_row.POSTS}</td>
				<td class="fm-gm-c-from">{pending_members_row.FROM}</td>
				<td class="fm-gm-c-email">{pending_members_row.EMAIL_IMG}</td>
				<td class="fm-gm-c-www">{pending_members_row.WWW_IMG}</td>
				<td class="posts fm-gm-c-select"><input type="checkbox" name="pending_members[]" value="{pending_members_row.USER_ID}" checked="checked" /></td>
			</tr>
			<!-- END pending_members_row -->
		</tbody>
		</table>
		<br />
		<p class="right-box fm-gm-remove fm-gm-approve"><input class="button2 fm-gm-yes" type="submit" name="approve" value="{L_APPROVE_SELECTED}" />&nbsp;<input class="button2 fm-gm-no" type="submit" name="deny" value="{L_DENY_SELECTED}" /></p>
		<div class="clear"></div>
		<span class="corners-bottom"><span></span></span></div>
</div>
