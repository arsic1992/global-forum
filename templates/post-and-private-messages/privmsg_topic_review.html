<!-- BEGIN switch_inline_mode -->
<h2 class="fm-pm-hist-title">{L_TOPIC_REVIEW}</h2>
<!-- END switch_inline_mode -->

<div class="fm-pm-history">
<!-- BEGIN postrow -->
<div class="panel {postrow.ROW_CLASS}{postrow.CURRENT_MSG} fm-pm-hist">
	<div class="inner"><span class="corners-top"><span></span></span>
	<div class="postbody">
		<div class="h3">{postrow.POST_SUBJECT_NEW}</div>
		<p class="author"><img src="{postrow.MINI_POST_IMG}" alt="" /> {postrow.L_TOPIC_BY} {postrow.POSTER_NAME} {postrow.L_TOPIC_ON} {postrow.POST_DATE}</p>
		<div class="content">{postrow.MESSAGE}</div>
	</div>
	<div class="fm-pm-hist-who"><dl class="postprofile"><dt>{postrow.POSTER_AVATAR}<br />{postrow.POSTER_NAME}</dt></dl></div>
	<span class="corners-bottom"><span></span></span></div>
</div>
<!-- END postrow -->
</div>
<div class="pagination fm-pagebar fm-pm-hist-pages">
    <span class="fm-pages">{PM_PAGINATION}</span>
</div>
